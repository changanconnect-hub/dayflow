<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12132a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>DayFlow</title>
<style>
:root{--bg:#12132a;--card:#1c1d3a;--card2:#25274d;--tx:#eef0ff;--mut:#9aa0c8;--pri:#7c5cff;--ok:#3ddc97;--warn:#ffb703;--bad:#ff5d73;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{background:radial-gradient(1200px 500px at 80% -10%,#2b1f6b 0%,transparent 60%),radial-gradient(900px 400px at -10% 10%,#103a4a 0%,transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px 0}
h2.ttl{font-size:19px;margin:22px 4px 10px}
h3{margin:4px 0 10px;font-size:20px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 6px 24px #0004}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.btn{border:0;border-radius:14px;padding:11px 15px;font-size:15px;font-weight:600;background:var(--card2);color:var(--tx);cursor:pointer}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,#7c5cff,#c05cff);color:#fff;box-shadow:0 6px 18px #7c5cff55}
.btn.ok{background:linear-gradient(135deg,#21c47d,#3ddc97);color:#06281a}
.btn.ghost{background:transparent;border:1px solid #3a3d6e;color:var(--mut)}
.btn.danger{background:#3a1622;color:#ff8da0}
.btn.big{padding:14px 20px;font-size:17px}
.btn.wide{width:100%;margin-top:10px}
input,textarea,select{width:100%;background:#13142b;border:1px solid #33366a;color:var(--tx);border-radius:12px;padding:11px 12px;font-size:16px;font-family:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--pri)}
textarea{resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
label input,label textarea,label select{margin-top:4px}
.lbl{font-size:13px;color:var(--mut);margin:10px 0 6px}
/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 4px 12px}
.hello{font-size:24px;font-weight:800}
.date{color:var(--mut);font-size:14px;margin-top:2px}
.prog{text-align:right}
.prog b{font-size:22px}
.bar{height:8px;background:#ffffff14;border-radius:9px;overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3ddc97,#7c5cff,#f15bb5);border-radius:9px;transition:width .5s}
.focus{background:linear-gradient(135deg,#2a2160,#1d2f4f);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.banner{background:#2b2350;border:1px dashed #7c5cff;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
/* hero */
.hero{position:relative;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,#1c1d3a),#1c1d3a 70%);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:22px;padding:16px;margin-bottom:14px;overflow:hidden}
.hlabel{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.htitle{font-size:20px;font-weight:800;margin-top:4px}
.htitle.big{font-size:24px}
.hsub{color:var(--mut);font-size:14px;margin-top:2px}
.hero.run{display:flex;gap:14px;align-items:center}
.ringbox{position:relative;width:128px;height:128px;flex:0 0 auto}
.ringbox svg{transform:rotate(-90deg)}
.tmr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.tmr.over{color:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.hinfo{flex:1;min-width:0}
/* quick timer */
.quick{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;background:var(--card);border-radius:14px;padding:8px 10px;margin-bottom:14px;font-size:14px}
.quick .q{border:0;background:var(--card2);color:var(--tx);border-radius:10px;padding:7px 8px;font-weight:600;font-size:13px}
.quick .qt{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
/* timeline */
.tlh{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 8px}
.tlh b{font-size:17px}
.link{background:none;border:0;color:#b9a8ff;font-weight:600;font-size:14px;padding:6px}
.task{display:flex;gap:10px;align-items:stretch;margin-bottom:8px}
.tcol{width:46px;flex:0 0 auto;text-align:right;padding-top:12px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.tbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border-left:4px solid var(--c);border-radius:14px;padding:10px 10px 10px 12px;min-width:0}
.tbody{flex:1;min-width:0;cursor:pointer}
.tname{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis}
.tmeta{color:var(--mut);font-size:12.5px;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tnote{font-size:13px;color:#cfd3ff;margin-top:5px;white-space:pre-wrap}
.tnote.add{color:#6e73a8}
.task.done .tbox{background:#17302a;opacity:.85}
.task.done .tname{text-decoration:line-through;text-decoration-color:#3ddc9799}
.task.skipped .tbox{opacity:.45}
.task.running .tbox{box-shadow:0 0 0 2px var(--c),0 0 22px color-mix(in srgb,var(--c) 50%,transparent)}
.task.late .tcol{color:var(--warn)}
.chip{font-size:11.5px;padding:2px 7px;border-radius:20px;background:#ffffff14}
.chip.late{background:#4a3a0c;color:#ffd166}
.chip.mv{background:#262a55;color:#a9b0ff}
.chip.warn{background:#4b1726;color:#ff9fb0}
.chip.okc{background:#123d2c;color:#7ff0bd}
.ib{border:0;width:44px;height:44px;border-radius:13px;font-size:18px;background:var(--card2);color:var(--tx);flex:0 0 auto}
.ib.go{background:linear-gradient(135deg,#7c5cff,#c05cff);color:#fff}
.ib.chk{background:#173a2d;color:var(--ok)}
.ib:active{transform:scale(.92)}
.acts{display:flex;gap:6px}
.donemark{font-size:22px;color:var(--ok);padding:0 6px}
.livedot{width:10px;height:10px;border-radius:50%;background:var(--c);animation:pulse 1s infinite;margin:0 10px}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:#151633ee;backdrop-filter:blur(12px);border-top:1px solid #2a2c58;display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px;padding:6px 8px;border-radius:12px;min-width:58px}
nav button span{font-size:22px;filter:grayscale(.6);opacity:.8}
nav button.on{color:#fff;background:#ffffff10}
nav button.on span{filter:none;opacity:1}
/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:40;display:none}
#sheetWrap.open{display:block}
.backdrop{position:absolute;inset:0;background:#0009;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:#1b1c38;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;animation:up .25s ease-out}
.sheet::before{content:"";display:block;width:44px;height:5px;background:#3a3d6e;border-radius:4px;margin:-6px auto 12px}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.menu button{display:block;width:100%;text-align:left;border:0;background:var(--card2);color:var(--tx);font-size:16px;padding:14px;border-radius:13px;margin-top:8px}
.or{text-align:center;color:var(--mut);font-size:13px;margin:14px 0 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.frow{display:flex;gap:8px}
.frow .emo{width:64px;text-align:center;font-size:22px;padding:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chipb{border:1px solid #33366a;background:transparent;color:var(--mut);border-radius:20px;padding:7px 11px;font-size:13.5px}
.chipb.on{background:var(--pri);border-color:var(--pri);color:#fff}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:#fff}
.tog{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--tx);margin-top:12px}
.tog input{width:22px;height:22px;accent-color:var(--pri);margin:0}
.hint{font-size:12px;color:#7a80b5;margin-top:5px}
/* toast & alarm */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2e2a63;color:#fff;padding:11px 16px;border-radius:14px;font-weight:600;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 30px #0008}
#toast.show{opacity:1;transform:translateX(-50%)}
#alarm{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:#0a0b1ccc;backdrop-filter:blur(6px)}
#alarm.show{display:flex}
#alarm .box{background:linear-gradient(135deg,#ff7a59,#f15bb5);border-radius:26px;padding:28px 22px;text-align:center;width:min(88vw,380px);animation:shake .6s infinite alternate}
@keyframes shake{from{transform:rotate(-1.5deg) scale(1)}to{transform:rotate(1.5deg) scale(1.03)}}
#alarm .big{font-size:56px}
#alarm .t{font-size:24px;font-weight:900;margin:6px 0}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80;display:none}
/* plan page */
.prow{display:flex;gap:10px;align-items:center;background:var(--card);border-left:4px solid var(--c);border-radius:14px;padding:10px;margin-bottom:8px}
.prow.skipped{opacity:.4}
.ptime{font-weight:800;font-variant-numeric:tabular-nums;width:50px}
.pbody{flex:1;min-width:0;cursor:pointer}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pill{font-size:13px;background:var(--card2);padding:4px 9px;border-radius:20px}
.pill.done{background:#173a2d}
.pill.todo,.pill.running{background:#3d1a26}
.moods{display:flex;gap:6px;margin-bottom:10px}
.mood{flex:1;border:0;background:var(--card2);font-size:26px;padding:8px 0;border-radius:12px;filter:grayscale(1);opacity:.6}
.mood.on{filter:none;opacity:1;background:#3a2f7a}
/* notes */
.search{margin:4px 0}
.note{background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px}
.note.pinned{border:1px solid #7c5cff88}
.note.done .nt{text-decoration:line-through;color:var(--mut)}
.nh{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}
.nt{margin:6px 0 8px;white-space:pre-wrap;line-height:1.4}
.nb{display:flex;gap:6px;justify-content:flex-end}
.nb button{border:0;background:var(--card2);color:var(--tx);border-radius:10px;padding:6px 10px;font-size:14px}
/* stats */
.hab{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;border-left:4px solid var(--c)}
.hab .nm{flex:1;min-width:0}
.hab .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{width:14px;height:14px;border-radius:5px;background:#2a2c55}
.dots i.done{background:var(--c)}
.dots i.miss{background:#5a2232}
.dots i.pending{background:transparent;border:2px dashed #555a90}
.dots i.skip{background:#3a3c5e}
.fire{text-align:center;min-width:56px}
.fire b{font-size:22px}
.fire small{display:block;color:var(--mut);font-size:11px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.heat i{aspect-ratio:1;border-radius:7px;background:#25274d;display:flex;align-items:center;justify-content:center;font-size:10px;font-style:normal;color:#ffffff99}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;padding:12px;text-align:center}
.kpi b{font-size:22px;display:block}
.kpi span{font-size:12px;color:var(--mut)}
.tpl{background:var(--card);border-left:4px solid var(--c);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}
.tplh{display:flex;justify-content:space-between}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;margin:6px 0 12px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:11px;font-weight:700;font-size:15px}
.seg button.on{background:var(--pri);color:#fff}
.missed{background:#2a1c33;border:1px solid #6b2c4a;border-radius:18px;padding:12px;margin-bottom:14px}
.missed .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mrow{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid #ffffff10}
.mrow .mn{flex:1;min-width:0;font-size:14.5px}
.mrow .mn small{display:block;color:var(--mut);font-size:12px}
.mb{border:0;border-radius:10px;padding:8px 9px;font-size:13px;font-weight:700;background:var(--card2);color:var(--tx)}
.mb.p{background:#7c5cff;color:#fff}
.rhead{background:linear-gradient(135deg,#2a2160,#1d2f4f);border-radius:18px;padding:14px;margin-bottom:12px;line-height:1.5}
.rhead b.big{font-size:30px;display:block}
.rarea{background:var(--card);border-left:4px solid var(--c);border-radius:14px;padding:12px;margin-bottom:10px}
.rarea .rt{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.rbar{height:6px;background:#ffffff12;border-radius:6px;overflow:hidden;margin:8px 0}
.rbar i{display:block;height:100%;background:var(--c)}
.rnums{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.rsum{font-size:14px;line-height:1.5;margin-top:8px;color:#dfe2ff}
.rmiss{font-size:12.5px;color:#ff9fb0;margin-top:6px}
</style>
</head>
<body>
<main id="main"></main>
<nav id="nav">
  <button data-act="tab" data-id="today"><span>🏠</span>Today</button>
  <button data-act="tab" data-id="tomorrow"><span>🌙</span>Tomorrow</button>
  <button data-act="tab" data-id="notes"><span>📝</span>Notes</button>
  <button data-act="tab" data-id="stats"><span>📊</span>Progress</button>
  <button data-act="tab" data-id="plan"><span>⚙️</span>Plan</button>
</nav>
<div id="sheetWrap"></div>
<div id="toast"></div>
<div id="alarm" data-act="dismissAlarm"><div class="box"><div class="big">⏰</div><div class="t">Time's up!</div><div id="alarmText"></div><button class="btn big" style="margin-top:16px;background:#fff;color:#c2185b">Got it</button></div></div>
<canvas id="confetti"></canvas>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">
<script>
'use strict';
/* ---------- constants ---------- */
const KEY='dayflow_v1';
const ALL=[0,1,2,3,4,5,6];
const DOWS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const COLORS=['#ff7a59','#ff4d6d','#2ec4b6','#f15bb5','#ffb703','#4cc9f0','#9b5de5','#80ed99','#a0a0ff','#ffd166'];
const PRAISE=['Nice! 🔥','That\'s consistency 💪','One more brick in the wall 🧱','Future you says thanks 🙌','Boom. Done. ✅','You showed up. That\'s the whole game 🎯','Discipline unlocked 🔓','Keep the chain going ⛓️'];
const DEFAULT_TEMPLATE=[
 {id:'pushups',emoji:'💪',name:'Push-ups',color:'#ff7a59',start:'09:10',dur:10,timer:10,days:ALL,fixed:false},
 {id:'chinese',emoji:'🇨🇳',name:'Chinese (HelloChinese)',color:'#ff4d6d',start:'09:30',dur:15,timer:15,days:ALL,fixed:false},
 {id:'cats',emoji:'🐱',name:'Cats garden',color:'#2ec4b6',start:'11:00',dur:120,timer:0,days:ALL,fixed:false},
 {id:'pilates',emoji:'🧘',name:'Vivo Pilates video',color:'#f15bb5',start:'13:45',dur:40,timer:40,days:ALL,fixed:false},
 {id:'foxbear',emoji:'🦊',name:'Fox & Bear AI video',color:'#ffb703',start:'15:00',dur:60,timer:60,days:[1,3,5,6],fixed:false},
 {id:'econ',emoji:'📚',name:'Economics: learn & write',color:'#4cc9f0',start:'17:00',dur:40,timer:40,days:[0,1,2,3,4],fixed:false},
 {id:'free',emoji:'🌿',name:'Free time (guilt-free)',color:'#80ed99',start:'20:00',dur:120,timer:0,days:ALL,fixed:false},
 {id:'plan',emoji:'🌙',name:'Plan tomorrow',color:'#9b5de5',start:'23:00',dur:10,timer:0,days:ALL,fixed:true}
];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const hm=m=>{m=Math.round(m);m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const toMin=s=>{const p=String(s||'0:0').split(':').map(Number);return (p[0]||0)*60+(p[1]||0)};
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey=()=>dk(new Date());
const keyAdd=(k,n)=>{const[y,m,d]=k.split('-').map(Number);return dk(new Date(y,m-1,d+n))};
const dowOf=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).getDay()};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDur=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':''):m+'m'};
const fmtDate=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'})};
const mmss=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+pad(m):pad(m))+':'+pad(x)};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const planKey=()=>new Date().getHours()<4?todayKey():keyAdd(todayKey(),1);
const reviewKey=()=>new Date().getHours()<4?keyAdd(todayKey(),-1):todayKey();
const daysLabel=d=>{const s=[...d].sort().join();if(s==='0,1,2,3,4,5,6')return 'Every day';if(s==='1,2,3,4,5')return 'Mon–Fri';if(s==='0,6')return 'Weekends';return [1,2,3,4,5,6,0].filter(i=>d.includes(i)).map(i=>DOWS[i]).join(' ')};

/* ---------- state ---------- */
function fresh(){return {v:1,template:JSON.parse(JSON.stringify(DEFAULT_TEMPLATE)),days:{},notes:[],settings:{sound:true,vibrate:true,awake:true},quick:null}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.template)){s.days=s.days||{};s.notes=s.notes||[];s.settings=Object.assign({sound:true,vibrate:true,awake:true},s.settings||{});return s}}catch(e){}return fresh()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ Could not save')}}
let TAB='today',CTX=null,NF={area:'all',q:''};

function buildDay(k){const dow=dowOf(k);return {tasks:S.template.filter(t=>t.days.includes(dow)).map(t=>({id:uid(),tpl:t.id,emoji:t.emoji,name:t.name,color:t.color,start:toMin(t.start),planStart:toMin(t.start),dur:+t.dur||10,timer:+t.timer||0,fixed:!!t.fixed,status:'todo',note:''})).sort((a,b)=>a.start-b.start),focus:'',review:'',mood:'',locked:false}}
function day(k){if(!S.days[k]){S.days[k]=buildDay(k);save()}return S.days[k]}
function findTask(id){const tk=todayKey();const keys=[tk,keyAdd(tk,-1),keyAdd(tk,1),planKey()];for(const k of keys){const d=S.days[k];if(!d)continue;const t=d.tasks.find(x=>x.id===id);if(t)return {k,d,t}}return null}

/* ---------- smart re-planning ---------- */
// ref task moved from [oldStart,oldEnd] to [newStart,newEnd]; shift what's after it, push anything overlapping.
function replan(d,ref,oldStart,oldEnd,newStart,newEnd){
 const now=nowMin();
 const todo=d.tasks.filter(t=>t!==ref&&t.status==='todo').sort((a,b)=>a.start-b.start);
 const outOfOrder=todo.some(t=>!t.fixed&&t.start>=now&&t.start<oldStart);
 let shift=newEnd-oldEnd; if(shift<0&&outOfOrder)shift=0;
 const fixed=todo.filter(t=>t.fixed);
 let prev=now;
 const run=d.tasks.find(t=>t.status==='running'&&t!==ref);
 if(run)prev=Math.max(prev,run.start+run.dur);
 let moved=0;
 for(const t of todo){
  if(t.fixed)continue;
  if(t.start<now&&t.start<oldStart)continue; // earlier overdue tasks stay marked late
  let ns=t.start>=oldStart?t.start+shift:t.start;
  ns=Math.max(ns,prev);
  if(ns<newEnd&&ns+t.dur>newStart)ns=newEnd;
  for(const f of fixed){if(ns<f.start+f.dur&&ns+t.dur>f.start)ns=f.start+f.dur}
  if(ns!==t.start){t.start=ns;moved++}
  prev=ns+t.dur;
 }
 return moved;
}
// after a manual edit: push anything overlapping 'ref' to after it, cascading only where needed
function pushAfter(d,ref){
 const todo=d.tasks.filter(t=>t!==ref&&t.status==='todo'&&!t.fixed).sort((a,b)=>a.start-b.start);
 const fixed=d.tasks.filter(t=>t!==ref&&t.status==='todo'&&t.fixed);
 let prev=ref.start+ref.dur,moved=0;
 for(const t of todo){
  if(t.start+t.dur<=ref.start)continue;
  let ns=Math.max(t.start,prev);
  for(const f of fixed){if(ns<f.start+f.dur&&ns+t.dur>f.start)ns=f.start+f.dur}
  if(ns!==t.start){t.start=ns;moved++}
  prev=Math.max(prev,ns+t.dur);
 }
 return moved}
function replanFromNow(d){
 const now=nowMin();const todo=d.tasks.filter(t=>t.status==='todo').sort((a,b)=>a.start-b.start);
 const fixed=todo.filter(t=>t.fixed);let prev=now;const run=d.tasks.find(t=>t.status==='running');
 if(run)prev=Math.max(prev,run.start+run.dur);let moved=0;
 for(const t of todo){if(t.fixed)continue;let ns=Math.max(t.start,prev);
  for(const f of fixed){if(ns<f.start+f.dur&&ns+t.dur>f.start)ns=f.start+f.dur}
  if(ns!==t.start){t.start=ns;moved++}prev=ns+t.dur}
 return moved;
}

function chime(){if(!S.settings.sound)return;unlockAudio();if(!AC)return;const notes=[784,988,1175,1568];const t0=AC.currentTime+0.05;
 for(let r=0;r<3;r++)notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;const st=t0+r*1.1+i*0.14;g.gain.setValueAtTime(0.0001,st);g.gain.linearRampToValueAtTime(0.5,st+0.02);g.gain.exponentialRampToValueAtTime(0.001,st+0.55);o.connect(g);g.connect(AC.destination);o.start(st);o.stop(st+0.6)})}

 const ring=()=>{if(!ALARM_ON)return;chime();if(S.settings.vibrate&&navigator.vibrate)navigator.vibrate([500,200,500,200,900])};
 ring();alarmTimers=[setTimeout(ring,9000),setTimeout(ring,18000),setTimeout(ring,30000)];notify(text)}

/* ---------- streak logic ---------- */
function hState(k,tpl,tk){const d=S.days[k];
 if(d){const ts=d.tasks.filter(t=>t.tpl===tpl.id);if(!ts.length)return 'none';if(ts.some(t=>t.status==='done'))return 'done';if(k===tk)return 'pending';if(ts.every(t=>t.status==='skipped'))return 'skip';return 'miss'}
 if(k===tk)return 'pending';if(k<firstKey())return 'none';return tpl.days.includes(dowOf(k))?'miss':'none'}
function firstKey(){const ks=Object.keys(S.days).sort();return ks[0]||todayKey()}
function streaks(tpl){const tk=todayKey();let k=firstKey(),run=0,best=0,n=0;while(k<=tk&&n<1500){const s=hState(k,tpl,tk);if(s==='done'){run++;best=Math.max(best,run)}else if(s==='miss')run=0;k=keyAdd(k,1);n++}return {cur:run,best}}

/* ---------- missed tasks rescue ---------- */
function missedList(){const tk=todayKey(),out=[];
 for(let i=1;i<=7;i++){const k=keyAdd(tk,-i),d=S.days[k];if(!d)continue;
  d.tasks.forEach(t=>{if((t.status==='todo'||(t.status==='running'&&i>1))&&!t.resolved&&t.tpl!=='plan')out.push({k,t})})}
 return out}
function nextFree(d,base,dur){const busy=d.tasks.filter(t=>t.status==='todo'||t.status==='running').map(t=>[t.start,t.start+t.dur]).sort((a,b)=>a[0]-b[0]);
 let s=base;for(const [a,b] of busy){if(s+dur<=a)break;if(b>s)s=b}return s}
function rescheduleTo(k,t,targetKey){const d=day(targetKey);const isToday=targetKey===todayKey();
 const base=isToday?Math.ceil(nowMin()/5)*5:Math.min(9*60,...d.tasks.map(x=>x.start));
 const st=nextFree(d,base,t.dur);
 d.tasks.push({id:uid(),tpl:t.tpl,emoji:t.emoji,name:t.name+(d.tasks.some(x=>x.tpl&&x.tpl===t.tpl)?' (catch-up)':''),color:t.color,start:st,planStart:st,dur:t.dur,timer:t.timer,fixed:false,status:'todo',note:t.note||'',from:k});
 d.tasks.sort((a,b)=>a.start-b.start);t.resolved='moved';if(t.status==='running'){t.status='todo';delete t.runTs}return st}

let PV='report',RG={mode:'week',from:'',to:''};
function rangeOf(){const tk=todayKey(),now=new Date();const dow=(now.getDay()+6)%7;
 const mStart=dk(new Date(now.getFullYear(),now.getMonth(),1));
 switch(RG.mode){
  case 'week':return [keyAdd(tk,-dow),tk];
  case 'lastweek':return [keyAdd(tk,-dow-7),keyAdd(tk,-dow-1)];
  case 'month':return [mStart,tk];
  case 'lastmonth':return [dk(new Date(now.getFullYear(),now.getMonth()-1,1)),keyAdd(mStart,-1)];
  case '30':return [keyAdd(tk,-29),tk];
  default:{let f=RG.from||keyAdd(tk,-6),t=RG.to||tk;if(f>t){const x=f;f=t;t=x}return [f,t]}}}
const shortDate=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})};
function buildReport(){
 const [from,to]=rangeOf(),tk=todayKey(),fk=firstKey();const areasMap={};
 const get=(id,t)=>areasMap[id]||(areasMap[id]={id,emoji:t.emoji,name:t.name,color:t.color,planned:0,done:0,missed:0,moved:0,skipped:0,pending:0,mins:0,ontime:0,missDates:[],taskNotes:[]});
 let days=0;
 for(let k=from;k<=to&&k<=tk;k=keyAdd(k,1)){days++;const d=S.days[k];
  if(d){d.tasks.forEach(t=>{if(t.tpl==='plan'&&t.status!=='done'&&k===tk)return;
    const tpl=t.tpl&&S.template.find(x=>x.id===t.tpl);const a=get(t.tpl||'oneoff',tpl||{emoji:'⭐',name:'One-off tasks',color:'#a0a0ff'});
    if(t.from&&t.status!=='done')return; // catch-up copies count only when done
    if(!t.from)a.planned++;
    if(t.status==='done'){a.done++;a.mins+=Math.max(0,t.actualEnd-t.actualStart);if(Math.abs(t.actualStart-(t.planStart!=null?t.planStart:t.start))<=15)a.ontime++;if(t.note)a.taskNotes.push(t.note);if(t.from)a.planned++}
    else if(t.status==='skipped')a.skipped++;
    else if(k===tk)a.pending++;
    else{a.missed++;a.missDates.push(k);if(t.resolved==='moved')a.moved++}})}
  else if(k>=fk&&k<tk){const dow=dowOf(k);S.template.forEach(tp=>{if(tp.id==='plan'||!tp.days.includes(dow))return;const a=get(tp.id,tp);a.planned++;a.missed++;a.missDates.push(k)})}}
 const fromTs=new Date(from+'T00:00:00').getTime(),toTs=new Date(to+'T23:59:59').getTime();
 const notes=S.notes.filter(n=>n.ts>=fromTs&&n.ts<=toTs);
 const order=S.template.map(t=>t.id).concat(['oneoff']);
 const list=Object.values(areasMap).sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
 list.forEach(a=>{a.notes=notes.filter(n=>n.area===a.id)});
 return {from,to,days,list,notes,general:notes.filter(n=>!areasMap[n.area])}}
function areaSummary(a){const den=a.planned-a.skipped-a.pending;const pct=den>0?Math.round(a.done/den*100):0;const p=[];
 if(!a.planned&&!a.done)return 'Nothing planned in this period.';
 p.push('Done '+a.done+' of '+den+' times ('+Math.min(100,pct)+'%)'+(a.mins?', '+fmtDur(a.mins)+' in total':'')+'.'+(a.pending?' '+a.pending+' still to do today.':''));
 if(a.missed===0&&a.done)p.push('No misses — perfect consistency 🔥');
 else if(a.missed)p.push('Missed '+a.missed+'×'+(a.moved?' ('+a.moved+' rescheduled)':'')+'.');
 if(a.done>=3)p.push(a.ontime/a.done>=.7?'Mostly on time.':'Often done at a different time than planned — maybe move its default time.');
 if(a.skipped)p.push('Skipped on purpose '+a.skipped+'×.');
 if(a.taskNotes.length)p.push('What you did: '+a.taskNotes.slice(-3).map(x=>'“'+x+'”').join(', ')+'.');
 if(a.notes.length){const dn=a.notes.filter(n=>n.done).length;p.push(a.notes.length+' new idea'+(a.notes.length>1?'s':'')+(dn?' ('+dn+' done)':'')+', e.g. “'+a.notes[a.notes.length-1].text.slice(0,70)+'”.')}
 return p.join(' ')}
function reportText(R){const L=['DayFlow report '+R.from+' → '+R.to,''];
 R.list.forEach(a=>{L.push(a.emoji+' '+a.name+': '+areaSummary(a));if(a.missDates.length)L.push('   Missed on: '+a.missDates.map(shortDate).join(', '));a.taskNotes.forEach(n=>L.push('   - did: '+n));a.notes.forEach(n=>L.push('   - idea: '+n.text.replace(/\n/g,' ')+(n.done?' [done]':'')))});
 if(R.general.length){L.push('💡 General notes:');R.general.forEach(n=>L.push('   - '+n.text.replace(/\n/g,' ')))}
 return L.join('\n')}

function taskRow(t,now,missedY){
 const late=t.status==='todo'&&t.start+t.dur<now;
 const time=t.status==='done'?hm(t.actualStart)+'–'+hm(t.actualEnd)+' · '+fmtDur(t.actualEnd-t.actualStart):hm(t.start)+'–'+hm(t.start+t.dur)+' · '+fmtDur(t.dur);
 const chips=[];
 if(t.timer&&t.status!=='done')chips.push('⏱'+t.timer+'m');
 if(t.fixed)chips.push('📌');
 if(t.status==='todo'&&t.planStart!=null&&t.start!==t.planStart)chips.push('<span class="chip mv">↻ was '+hm(t.planStart)+'</span>');
 if(late)chips.push('<span class="chip late">late</span>');
 if(missedY&&t.status==='todo')chips.push('<span class="chip warn">missed yesterday · never miss twice!</span>');
 if(t.status==='done')chips.push('<span class="chip okc">done</span>');
 if(t.status==='skipped')chips.push('<span class="chip">skipped</span>');
 let acts='';
 if(t.status==='todo')acts=t.tpl==='plan'?'<button class="ib go" data-act="goTomorrow">🌙</button>':'<div class="acts"><button class="ib go" data-act="start" data-id="'+t.id+'">▶</button><button class="ib chk" data-act="doneManual" data-id="'+t.id+'">✓</button></div>';
 else if(t.status==='running')acts='<span class="livedot"></span>';
 else if(t.status==='done')acts='<span class="donemark">✓</span>';
 return '<div class="task '+t.status+(late?' late':'')+'" style="--c:'+t.color+'"><div class="tcol">'+hm(t.status==='done'?t.actualStart:t.start)+'</div><div class="tbox"><div class="tbody" data-act="menu" data-id="'+t.id+'"><div class="tname">'+t.emoji+' '+esc(t.name)+'</div><div class="tmeta"><span>'+time+'</span>'+chips.map(c=>'<span>'+c+'</span>').join('')+'</div>'+(t.note?'<div class="tnote">📝 '+esc(t.note)+'</div>':'')+'</div>'+acts+'</div></div>';
}

function vStreaks(){
 const tk=todayKey();
 let perfect=0,mins=0;
 Object.entries(S.days).forEach(([k,d])=>{const a=d.tasks.filter(t=>t.status!=='skipped');if(k<tk&&a.length&&a.every(t=>t.status==='done'))perfect++});
 for(let i=0;i<7;i++){const d=S.days[keyAdd(tk,-i)];if(d)d.tasks.forEach(t=>{if(t.status==='done')mins+=Math.max(0,t.actualEnd-t.actualStart)})}
 const sts=S.template.map(t=>({t:t,s:streaks(t)}));
 const bestNow=Math.max(0,...sts.map(x=>x.s.cur));
 let heat='';for(let i=27;i>=0;i--){const k=keyAdd(tk,-i),d=S.days[k];let p=-1;if(d){const a=d.tasks.filter(t=>t.status!=='skipped');p=a.length?a.filter(t=>t.status==='done').length/a.length:-1}
  const bg=p<0?'#25274d':'rgba(61,220,151,'+(0.15+p*0.85).toFixed(2)+')';heat+='<i style="background:'+bg+(k===tk?';outline:2px solid #7c5cff':'')+'">'+Number(k.slice(8))+'</i>'}
 return '<div class="kpis"><div class="kpi"><b>'+bestNow+'🔥</b><span>top streak now</span></div><div class="kpi"><b>'+perfect+'</b><span>perfect days</span></div><div class="kpi"><b>'+fmtDur(mins)+'</b><span>done last 7 days</span></div></div>'+
 sts.map(({t,s})=>{let dots='';for(let i=6;i>=0;i--)dots+='<i class="'+hState(keyAdd(tk,-i),t,tk)+'"></i>';
  let wm=0;for(let i=0;i<7;i++){const d=S.days[keyAdd(tk,-i)];if(d)d.tasks.forEach(x=>{if(x.tpl===t.id&&x.status==='done')wm+=Math.max(0,x.actualEnd-x.actualStart)})}
  return '<div class="hab" style="--c:'+t.color+'"><div class="nm"><b>'+t.emoji+' '+esc(t.name)+'</b><div class="mut" style="font-size:12px">best '+s.best+' · '+fmtDur(wm)+' this week</div><div class="dots">'+dots+'</div></div><div class="fire"><b>'+s.cur+'</b><small>day streak</small></div></div>'}).join('')+
 '<div class="card" style="margin-top:14px"><b>Last 4 weeks</b><div class="mut" style="font-size:12px">greener = more of the day done</div><div class="heat">'+heat+'</div></div>'+
 '<div class="card"><b>The rules</b><div class="mut" style="margin-top:6px;line-height:1.5">• Small is fine — showing up counts.<br>• Never miss twice in a row.<br>• Skipping on purpose (😴) doesn\'t break a streak, but use it rarely.</div></div>';
}

function finishModal(id){

 const defEnd=Math.min(n,t.actualStart+(t.timer||t.dur));
 sheet('<h3>'+t.emoji+' '+esc(t.name)+'</h3><div class="mut">Started '+hm(t.actualStart)+' · app counted <b>'+fmtDur(el)+'</b></div>'+

 '<div class="or">— or I finished earlier / different time —</div>'+

 '<div class="chips">'+[10,15,20,30,45,60,90].map(m=>'<button class="chipb" data-act="took" data-id="'+m+'">took '+m+'m</button>').join('')+'</div>'+

function manualModal(id){
 const f=findTask(id);if(!f)return;const t=f.t;CTX={id:id};const n=nowMin();
 const s=t.status==='done'?t.actualStart:Math.min(t.start,Math.max(0,n-t.dur)),e=t.status==='done'?t.actualEnd:Math.min(n,s+t.dur);
 sheet('<h3>'+t.emoji+' '+esc(t.name)+'</h3><div class="mut">When did you do it?</div><div class="grid2"><label>Started<input type="time" id="fS" value="'+hm(s)+'"></label><label>Finished<input type="time" id="fE" value="'+hm(e)+'"></label></div>'+

 '<button class="btn ok wide big" data-act="saveManual">✓ Save</button>');

function complete(f,s,e){
 const t=f.t,d=f.d;if(e<s)e+=1440;
 const wasDone=t.status==='done';
 const oldStart=t.start,oldEnd=t.start+t.dur;
 t.status='done';t.actualStart=s;t.actualEnd=e;t.start=s;delete t.runTs;t.alarmed=false;
 let moved=0;if(!wasDone&&f.k===todayKey())moved=replan(d,t,oldStart,oldEnd,s,e);
 save();stopAlarm();keepAwake(needAwake());closeSheet();render();
 if(!wasDone){confetti();toast(pick(PRAISE)+(moved?' · re-planned '+moved+' task'+(moved>1?'s':''):''))}else toast('Times updated');
}

  if(t.status==='todo'||t.status==='skipped')o.push(['swapPick','🔁 Replace with another activity']);
  o.push(['editDay','✏️ Edit time / timer / note'],['noteFor','💡 Save an idea for this'],['removeTask','🗑 Remove from today']);
  sheet('<h3>'+t.emoji+' '+esc(t.name)+'</h3><div class="mut">'+(t.status==='done'?'Done '+hm(t.actualStart)+'–'+hm(t.actualEnd):'Planned '+hm(t.start)+'–'+hm(t.start+t.dur))+'</div>'+(t.note?'<div class="tnote">📝 '+esc(t.note)+'</div>':'')+'<div class="menu">'+o.map(x=>'<button data-act="'+x[0]+'" data-id="'+id+'">'+x[1]+'</button>').join('')+'</div>')},
 moveNow:id=>{closeSheet();const f=findTask(id);if(!f)return;const t=f.t,n=nowMin(),os=t.start;const R=findRunning();const ns=R?Math.max(n,R.t.start+R.t.dur):n;t.start=ns;replan(f.d,t,os,os+t.dur,ns,ns+t.dur);save();render();toast('Moved to '+hm(ns))},
 skip:id=>{closeSheet();const f=findTask(id);if(!f)return;f.t.status='skipped';save();render();toast('Skipped. Tomorrow: never miss twice 💪')},
 unskip:id=>{closeSheet();const f=findTask(id);if(!f)return;f.t.status='todo';save();render()},
 undo:id=>{closeSheet();const f=findTask(id);if(!f)return;f.t.status='todo';delete f.t.actualStart;delete f.t.actualEnd;save();render()},
 removeTask:id=>{closeSheet();const f=findTask(id);if(!f)return;if(!confirm('Remove “'+f.t.name+'” from this day?'))return;f.d.tasks=f.d.tasks.filter(x=>x.id!==id);save();render()},
 editDay:id=>{closeSheet();const f=findTask(id);if(f)editModal(f.t,'day',f.k)},
 editPlan:id=>{const f=findTask(id);if(f)editModal(f.t,'day',f.k)},
 noteFor:id=>{closeSheet();const f=findTask(id);const area=f&&f.t.tpl||'general';CTX={};
  sheet('<h3>💡 Idea for '+(f?f.t.emoji+' '+esc(f.t.name):'')+'</h3><textarea id="qn" rows="4" placeholder="Write it before it disappears…"></textarea><button class="btn pri wide" data-act="saveQuickNote" data-id="'+area+'">Save idea</button>');setTimeout(()=>{const q=$('#qn');q&&q.focus()},250)},
 saveQuickNote:area=>{const v=$('#qn').value.trim();if(!v)return closeSheet();S.notes.push({id:uid(),area:area,text:v,ts:Date.now(),pinned:false,done:false});save();closeSheet();toast('💡 Saved to Notes')},
 replanNow:()=>{const n=replanFromNow(day(todayKey()));save();render();toast(n?'↻ Re-planned '+n+' task'+(n>1?'s':'')+' from now':'All good — nothing to move')},
 addToday:()=>addPicker(todayKey()),
 addPlan:()=>addPicker(planKey()),
 addCustom:k=>{closeSheet();const isT=k===todayKey();editModal({_new:true,emoji:'⭐',name:'',color:pick(COLORS),start:isT?Math.ceil(nowMin()/5)*5:12*60,dur:30,timer:0,fixed:false,note:''},'day',k)},
 addFromTpl:v=>{const [k,tid]=v.split('|');const tp=S.template.find(x=>x.id===tid);if(!tp)return;const d=day(k);
  const base=k===todayKey()?Math.ceil(nowMin()/5)*5:toMin(tp.start);const st=nextFree(d,base,+tp.dur||10);
  d.tasks.push(taskFromTpl(tp,st));d.tasks.sort((a,b)=>a.start-b.start);save();closeSheet();render();toast(tp.emoji+' Added at '+hm(st))},
 swapPick:id=>{closeSheet();const f=findTask(id);if(!f)return;sheet('<h3>🔁 Replace '+f.t.emoji+' '+esc(f.t.name)+' with…</h3><div class="mut">Keeps the same start time ('+hm(f.t.start)+')</div>'+pickerHtml('swapTo',id))},
 swapTo:v=>{const [id,tid]=v.split('|');const f=findTask(id);const tp=S.template.find(x=>x.id===tid);if(!f||!tp)return;const t=f.t;const old=t.name;
  Object.assign(t,{tpl:tp.id,emoji:tp.emoji,name:tp.name,color:tp.color,dur:+tp.dur||10,timer:+tp.timer||0,note:''});
  if(f.k===todayKey())replan(f.d,t,t.start,t.start,t.start,t.start+t.dur);save();closeSheet();render();toast('🔁 '+old+' → '+tp.name)},
 skipT:id=>{const f=findTask(id);if(!f)return;f.t.status=f.t.status==='skipped'?'todo':'skipped';save();render()},
 resetPlan:()=>{if(!confirm('Reset this plan to your default day? (notes on tasks are kept)'))return;const pk=planKey();const old=S.days[pk];delete S.days[pk];const d=day(pk);if(old){d.focus=old.focus;d.tasks.forEach(t=>{const o=old.tasks.find(x=>x.tpl===t.tpl);if(o)t.note=o.note})}save();render()},
 lock:()=>{const pk=planKey();day(pk).locked=true;const r=day(reviewKey());const p=r.tasks.find(t=>t.tpl==='plan'&&t.status!=='done');if(p){const n=nowMin();p.status='done';p.actualStart=Math.max(0,n-5);p.actualEnd=n;p.start=p.actualStart}save();render();confetti();toast('Plan locked 🔒 Sleep well — tomorrow is ready.')},
 mood:m=>{const r=day(reviewKey());r.mood=r.mood===m?'':m;save();render()},
 quick:id=>{let m=+id;if(id==='custom'){const v=prompt('Minutes?','25');m=parseInt(v,10);if(!m||m<1)return}
  const label=prompt('Label (optional) — e.g. “TikTok scroll”','')||'';unlockAudio();S.quick={endTs:Date.now()+m*60000,mins:m,label:label,alarmed:false};save();keepAwake(true);render()},
 quickStop:()=>{S.quick=null;save();stopAlarm();keepAwake(needAwake());render()},
 editTpl:id=>{const t=S.template.find(x=>x.id===id);if(t)editModal(t,'tpl')},
 newTpl:()=>editModal({_new:true,id:uid(),emoji:'⭐',name:'',color:pick(COLORS),start:'12:00',dur:30,timer:30,days:[...ALL],fixed:false},'tpl'),
 dayChip:(id,b)=>{const i=+id;const ds=CTX.days;const at=ds.indexOf(i);if(at>=0)ds.splice(at,1);else ds.push(i);b.classList.toggle('on')},
 colorChip:(id,b)=>{CTX.color=id;document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b))},
 saveEdit:()=>{const c=CTX,t=c.t;const name=$('#eName').value.trim();if(!name){toast('Give it a name');return}
  const v={emoji:$('#eEmoji').value.trim()||'⭐',name:name,color:c.color,dur:Math.max(1,parseInt($('#eDur').value,10)||10),timer:Math.max(0,parseInt($('#eTimer').value,10)||0),fixed:$('#eFixed').checked};
  if(c.mode==='tpl'){if(!c.days.length){toast('Pick at least one day');return}Object.assign(t,v,{start:$('#eStart').value||'12:00',days:[...c.days]});if(t._new){delete t._new;S.template.push(t)}refreshPlanDay();save();closeSheet();render();toast('Saved · applies from the next day')}
  else{const st=toMin($('#eStart').value||'12:00');const note=$('#eNote').value.trim();const d=day(c.dayKey);
   let ref=t;
   if(t._new){ref=Object.assign({id:uid(),tpl:null,start:st,planStart:st,status:'todo',note:note},v);d.tasks.push(ref)}
   else{Object.assign(t,v,{note:note});if(t.status==='todo'||t.status==='skipped'){t.start=st;t.planStart=st}}
   const moved=ref.status==='todo'?pushAfter(d,ref):0;
   d.tasks.sort((a,b)=>a.start-b.start);save();closeSheet();render();toast('Saved'+(moved?' · moved '+moved+' task'+(moved>1?'s':'')+' after it':''))}},
 delEdit:()=>{const c=CTX;if(!confirm('Delete “'+c.t.name+'”?'))return;if(c.mode==='tpl'){S.template=S.template.filter(x=>x!==c.t);refreshPlanDay()}else{const d=day(c.dayKey);d.tasks=d.tasks.filter(x=>x!==c.t)}save();closeSheet();render()},
 addNote:()=>{const v=$('#nText').value.trim();if(!v){toast('Write something first');return}S.notes.push({id:uid(),area:$('#nArea').value,text:v,ts:Date.now(),pinned:false,done:false});save();render();toast('💡 Saved')},
 nfilter:id=>{NF.area=id;render()},
 nPin:id=>{const n=S.notes.find(x=>x.id===id);if(n){n.pinned=!n.pinned;save();$('#nlist').innerHTML=notesList()}},
 nDone:id=>{const n=S.notes.find(x=>x.id===id);if(n){n.done=!n.done;save();$('#nlist').innerHTML=notesList()}},
 nDel:id=>{if(!confirm('Delete this note?'))return;S.notes=S.notes.filter(x=>x.id!==id);save();$('#nlist').innerHTML=notesList()},
 nEdit:id=>{const n=S.notes.find(x=>x.id===id);if(!n)return;CTX={nid:id};sheet('<h3>✏️ Edit note</h3><textarea id="enT" rows="6">'+esc(n.text)+'</textarea><label>Area<select id="enA">'+areas().map(a=>'<option value="'+a.id+'"'+(a.id===n.area?' selected':'')+'>'+a.emoji+' '+esc(a.name)+'</option>').join('')+'</select></label><button class="btn pri wide" data-act="nSave">Save</button>')},
 nSave:()=>{const n=S.notes.find(x=>x.id===CTX.nid);if(n){n.text=$('#enT').value.trim()||n.text;n.area=$('#enA').value;save()}closeSheet();render()},
 testSound:()=>{unlockAudio();chime();if(S.settings.vibrate&&navigator.vibrate)navigator.vibrate([300,100,300])},
 notifPerm:()=>{try{Notification.requestPermission().then(()=>render())}catch(e){}},
 exportData:()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dayflow-backup-'+todayKey()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Backup downloaded')},
 importData:()=>$('#importFile').click(),
 resetAll:()=>{if(!confirm('Delete ALL data and start fresh?'))return;if(!confirm('Really sure? Export a backup first if unsure.'))return;S=fresh();save();render()}
};

/* ---------- events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;
 if(b.id==='alarm'&&e.target.closest('.box')&&!e.target.closest('button'))return;
 const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset.id,b,e)}});
const BIND={
 review:v=>{day(reviewKey()).review=v;save()},
 focus:v=>{day(planKey()).focus=v;save()},
 nq:v=>{NF.q=v;$('#nlist').innerHTML=notesList()},
 rgFrom:v=>{RG.from=v},
 rgTo:v=>{RG.to=v},
 set_sound:(v,el)=>{S.settings.sound=el.checked;save()},
 set_vibrate:(v,el)=>{S.settings.vibrate=el.checked;save()},
 set_awake:(v,el)=>{S.settings.awake=el.checked;save();keepAwake(el.checked&&needAwake())}
};
function fallbackCopy(t){sheet('<h3>📋 Copy this</h3><textarea id="cpy" rows="12">'+esc(t)+'</textarea><div class="hint">Long-press → Select all → Copy</div>');setTimeout(()=>{const c=$('#cpy');c.focus();c.select()},250)}
function onBind(e){const k=e.target.dataset&&e.target.dataset.bind;if(k&&BIND[k])BIND[k](e.target.value,e.target)}
document.addEventListener('input',e=>{if(e.target.type!=='checkbox')onBind(e)});
document.addEventListener('change',e=>{if(e.target.type==='checkbox')onBind(e)});
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.template)throw 0;if(!confirm('Replace current data with this backup?'))return;S=s;S.settings=Object.assign({sound:true,vibrate:true,awake:true},S.settings||{});save();render();toast('Backup restored ✅')}catch(err){toast('That file is not a DayFlow backup')}};r.readAsText(f);e.target.value=''});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(needAwake())keepAwake(true);if(!sheetOpen())render()}});

/* ---------- ticking clock ---------- */
let lastMin=nowMin();
function tick(){
 const R=findRunning();
 if(R){const t=R.t,sec=(Date.now()-t.runTs)/1000;let txt,over=false,frac;
  if(t.timer>0){const rem=t.timer*60-sec;frac=Math.min(1,sec/(t.timer*60));
   if(rem<=0){over=true;txt='+'+mmss(-rem);if(!t.alarmed){t.alarmed=true;save();alarm(t.emoji+' '+t.name+' — session over! Tap Finish when you stop.')}}else txt=mmss(rem)}
  else{txt=mmss(sec);frac=Math.min(1,sec/60/Math.max(1,t.dur))}
  const el=document.getElementById('tmr');if(el){el.textContent=txt;el.classList.toggle('over',over)}
  const ring=document.getElementById('tmrRing');if(ring)ring.setAttribute('stroke-dashoffset',(351.86*(1-frac)).toFixed(1))}
 if(S.quick){const rem=(S.quick.endTs-Date.now())/1000;const el=document.getElementById('qtmr');
  if(rem<=0){if(el){el.textContent='Done!';el.style.color='#ffb703'}if(!S.quick.alarmed){S.quick.alarmed=true;save();alarm('⏱ '+(S.quick.label||'Quick timer')+' — '+S.quick.mins+' min are over')}}
  else if(el)el.textContent=mmss(rem)}
 const m=nowMin();if(m!==lastMin){lastMin=m;if(TAB==='today'&&!sheetOpen()&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render()}
}
setInterval(tick,1000);

/* ---------- boot ---------- */
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(needAwake())keepAwake(true);
render();
</script>
</body>
